<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Overlay instructions — hidden once the timer starts */
      #hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #cfe8ff;
        font-family: system-ui, sans-serif;
        font-size: 20px;
        letter-spacing: 1px;
        background: rgba(0, 0, 0, 0.55);
        cursor: pointer;
        user-select: none;
      }
      #hint.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas"></canvas>
    <div id="hint">点击启动彩色计时器 · Click to start the Color Timer 🔊</div>
    <script src="./script.js"></script>
  </body>
</html>
